name: Canary

# Asks the real job APIs whether they still return the shape our parsers read.
#
# This is the check CI structurally cannot perform. The unit tests in
# tests/test_sources.py assert each adapter against a CAPTURED payload, which
# freezes the vendor's shape as it was the day the fixture was written. If Jobicy
# renames `jobTitle` tomorrow, every fixture test still passes and the live harvest
# silently returns blank titles. The failure is invisible in a hermetic suite
# because the thing that changed is outside this repo.
#
# It runs on a SCHEDULE and never on a pull request, on purpose. These tests depend
# on other people's uptime, so wiring them into CI would block merges whenever
# someone else has a bad morning. A failure here is a notification, not a gate.
#
# The tests themselves distinguish "unreachable" (skip — their outage) from
# "reachable but unparseable" (fail — real drift), so a red run means something
# actually changed rather than something was briefly down.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 09:00 ET (cron is UTC; 13:00 UTC = 09:00 EDT)
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    # A hung request does not go RED, it goes QUIET — and quiet is
    # indistinguishable from healthy. Without this the job inherits GitHub's
    # 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-m live` overrides the `-m 'not live'` default in pyproject.toml, so this
      # runs ONLY the canary and none of the hermetic suite. -rs prints the skip
      # reasons, which is where "X was unreachable" is reported.
      - name: Ask the real APIs
        run: pytest -m live -v -rs --junitxml=canary.xml

      # An all-skip run exits 0. Every canary test skips when its endpoint is
      # unreachable, so a total outage — or an aggregator blocking GitHub's runner
      # IP range, which is the realistic case — produces a GREEN run that checked
      # nothing. A permanently dead canary is then indistinguishable from a healthy
      # one, which is worse than having no canary, because it reads as assurance.
      # `if: always()` so this still runs when the step above failed.
      - name: A run that checked nothing is not a passing run
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              s = ET.parse("canary.xml").getroot()
          except Exception as e:
              sys.exit(f"FAIL: no canary report to read ({type(e).__name__})")
          suite = s if s.tag == "testsuite" else s.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          errors = int(suite.get("errors", 0)) + int(suite.get("failures", 0))
          passed = total - skipped - errors
          print(f"total={total} passed={passed} skipped={skipped} failed={errors}")
          if passed == 0:
              sys.exit("FAIL: every canary test skipped — the endpoints were never "
                       "actually checked. Green here would mean nothing.")
          PY
