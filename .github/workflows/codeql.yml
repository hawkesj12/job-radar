name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      # SHA-pinned like every other action here: a tag can be repointed by whoever
      # controls the upstream repo, which is the vector behind real supply-chain
      # compromises. Dependabot's github-actions ecosystem bumps these, so the pins
      # reconcile rather than rot — including across a major version, which is how
      # this reached CodeQL v4: it landed as a reviewable PR that had to pass the
      # full matrix, rather than by silently following a mutable @v3 tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
