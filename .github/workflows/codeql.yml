name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      # SHA-pinned like every other action here: a tag can be repointed by whoever
      # controls the upstream repo, which is the vector behind real supply-chain
      # compromises. Dependabot's github-actions ecosystem bumps these, so the pins
      # reconcile rather than rot. Held at CodeQL v3 (still maintained — v3.37.4
      # shipped the same day as v4.37.4); a major bump is its own change, not a
      # side effect of pinning.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
