name: Release

# ONE production path, several rehearsal paths:
#   • push a v* TAG → REAL PyPI + a GitHub Release. Nothing else reaches real PyPI.
#   • anything else → TestPyPI only, no Release. Safe to fire anytime.
#
# The discriminator is `startsWith(github.ref, 'refs/tags/')`, NOT
# `github.event_name == 'push'`. That distinction is load-bearing: this workflow
# now also triggers on push-to-main, and event_name is 'push' for BOTH a tag and a
# branch — so the old test would have routed every merge to main straight at real
# PyPI. Anything added to the trigger list above must keep the tag check as the
# only thing that opens the production path.
#
# This replaces an `on: release: [published]` trigger that published whatever was
# on the tag WITHOUT running a single test (a tag push fires neither push-to-main
# nor pull_request) and without checking that the tag matched the packaged
# version. It had never actually run: every release 0.2.0–0.4.1 was uploaded by
# hand from a laptop.
#
# One-time setup, per index (Trusted Publishing, so no token is ever stored here):
#   pypi.org      → job-radar → Publishing → GitHub, hawkesj12/job-radar,
#                   workflow "release.yml", environment "pypi"
#   test.pypi.org → pending publisher, same repo/workflow, environment "testpypi"

# WHY THIS RUNS WHEN NOTHING IS BEING RELEASED
#
# Count the executions: CI has run ~30 times, this workflow 3. Every defect found
# in it was found by finally running it — it had never executed at all (five
# releases were uploaded by hand), its version guard was unverified until someone
# forced a mismatch, and its rehearsal could only be used once per version. A path
# that runs twice a year rots between uses, and it rots in the one place where a
# mistake cannot be undone. So it now runs on a cadence, like CI does.
on:
  push:
    tags: ["v*"] # production: real PyPI + a GitHub Release
    branches: [main] # rehearsal, but only when the release machinery itself moves
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "job_radar/__init__.py"
  schedule:
    - cron: "0 14 * * 1" # Mondays 10:00 ET — proves the path still works
  workflow_dispatch: {}

permissions:
  contents: read

# Two tag pushes in quick succession must not race through build and publish.
# NOT cancel-in-progress: a half-finished release is worse than a queued one, and
# a cancelled publish could leave the index and the GitHub Release disagreeing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Re-run the full 12-cell suite on the commit being released. Without this a
  # release publishes having run no tests at all — the gap that let a package
  # broken on Windows ship five times.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no push needed; keeps the token out of .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Verify the tag matches the packaged version
        # Tag runs only. A tag of v0.4.2 that ships 0.4.1 is unrecoverable once
        # published, because a PyPI version can never be replaced or reused. A
        # manual rehearsal has no tag, so this check is skipped there.
        # The version is dynamic (setuptools reads job_radar.__version__), so ask
        # the built metadata rather than parsing pyproject.toml.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('job_radar/__init__.py').read_text()).group(1))")"
          echo "tag=$TAG  package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "MISMATCH: tag $TAG != packaged $PKG"; exit 1; }

      - name: Check metadata renders on the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment gates which trusted publisher the OIDC token maps to:
    #   a v* TAG    → 'pypi'      → the real-PyPI publisher
    #   anything else → 'testpypi' → the TestPyPI publisher
    # Safe from the ternary trap below because BOTH values are non-empty (truthy).
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'pypi' || 'testpypi' }}
    permissions:
      # REQUIRED for Trusted Publishing: mints the short-lived OIDC token the index
      # exchanges for a 15-minute, project-scoped upload token. No stored secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          # GitHub Actions has no real ternary — `A && B || C` only works when B is
          # TRUTHY. An empty string is FALSY, so putting '' on the true side would
          # ALWAYS fall through to the other branch. Hence the negation: on a tag
          # this is false → falls through to '' → the action's default (real PyPI);
          # on every other trigger it is true → TestPyPI's URL.
          repository-url: ${{ !startsWith(github.ref, 'refs/tags/') && 'https://test.pypi.org/legacy/' || '' }}
          # Re-uploading a version is an ERROR on real PyPI and must stay one --
          # it means the tag/version guard let a duplicate through. On TestPyPI it
          # is just a rehearsal of a version already rehearsed, and refusing it is
          # what made this path unusable for re-validating the SAME unreleased
          # version, which is exactly when you most want to run it.
          skip-existing: ${{ !startsWith(github.ref, 'refs/tags/') }}

  # Tag runs only — a rehearsal must not cut a public Release.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a Release writes to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release from the changelog
        # pypa/gh-action-pypi-publish publishes to the index and nothing else —
        # creating a Release is explicitly outside its scope, so it happens here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
