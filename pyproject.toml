[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
dynamic = ["version"]
description = "Harvest the whole open job market for roles that fit you — direct from company ATS feeds and aggregator APIs — scored, deduped, with optional LLM semantic ranking."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Justin Hawkes" }]
keywords = ["job-search", "ats", "llm", "cli", "greenhouse", "lever"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",
  # Windows ships NO system time-zone database, so zoneinfo has nothing to read
  # and ZoneInfo("America/New_York") raises ZoneInfoNotFoundError. Both util.py
  # and sources.py build that object at MODULE level, so the failure lands on
  # `import job_radar` — the package was unusable on Windows, not merely wrong
  # about dates. Linux and macOS have a system tzdb and need no extra package,
  # hence the marker rather than an unconditional dependency.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The optional LLM re-rank uses stdlib HTTP — it needs no extra packages.
# Ranges here are for contributors; CI pins exact versions so an upstream release
# can't turn main red on a commit that changed nothing.
dev = ["pytest>=7.0", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
job-radar = "job_radar.cli:main"

[project.urls]
Homepage = "https://github.com/hawkesj12/job-radar"
Repository = "https://github.com/hawkesj12/job-radar"
Issues = "https://github.com/hawkesj12/job-radar/issues"
Changelog = "https://github.com/hawkesj12/job-radar/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["job_radar"]

[tool.setuptools.dynamic]
version = { attr = "job_radar.__version__" }

[tool.setuptools.package-data]
job_radar = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
# The live canary hits third-party APIs, so it is OFF by default: a contributor
# running `pytest` offline, or CI running it on twelve matrix cells, must never
# depend on someone else's uptime. The scheduled canary opts in with `-m live`.
addopts = "-m 'not live'"
markers = [
  "live: hits real third-party APIs; scheduled canary only, never CI",
]

[tool.mypy]
python_version = "3.10"
files = ["job_radar"]
# Deliberately NOT strict. This codebase passes untyped dicts (postings, config
# sections) between modules by design, so demanding annotations everywhere would
# produce hundreds of findings nobody will act on — and a check nobody acts on is
# noise that hides the real ones. These settings catch the errors that indicate a
# genuine defect (a call that can't work, a container built two different ways)
# and stay quiet otherwise.
warn_unused_ignores = true
warn_redundant_casts = true

# rapidfuzz ships no type information and has no stub package on typeshed. Without
# this, its import is a hard error that says nothing about our code. pyyaml IS
# covered — types-PyYAML is a dev dependency above rather than an ignore here.
[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true
