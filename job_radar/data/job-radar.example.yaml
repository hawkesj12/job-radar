# job-radar config — this IS your `job-radar.yaml` (written by `job-radar init`).
# Edit it in place and make it yours. Everything is optional; anything you omit
# uses a sensible generic default, so deleting a section is a valid way to reset it.

# ── profile: what you're looking for ────────────────────────────────────────
profile:
  # What the breadth (keyword) sources search for.
  title_queries:
    - AI Engineer
    - Applied AI Engineer
    - Machine Learning Engineer
    - Forward Deployed Engineer
    - LLM Engineer
  # A title must contain at least one of these to count as relevant.
  signal_titles:
    [ai, ml, machine learning, llm, agent, engineer, developer, architect,
     applied scientist, forward deployed, fde, solutions, automation]

# ── scoring: your judgment model (keyword -> points) ────────────────────────
scoring:
  # Add your own domain and location keywords here — this is where you tune fit.
  fit_weights:
    ai engineer: 3
    applied ai: 4
    forward deployed: 4
    fde: 4
    rag: 4
    agentic: 4
    multi-agent: 4
    llm: 3
    generative ai: 3
    claude: 2
    mcp: 2
    founding engineer: 5
    own the ai: 4
    internal tooling: 4
    remote: 4
    # e.g. add your own city / industry to pull those roles up:
    # your-city: 5
    # your-industry: 4
  title_penalties: { research scientist: 8, ai researcher: 6 }
  agency_penalties: { staffing: 8, our client: 12, consultancy: 10 }
  length_norm_b: 0.75      # BM25 length penalty b (0.75 = default)
  score_k1: 1.2            # gain on the length penalty. NOT term-frequency
                           # saturation -- each keyword counts once, so there is
                           # no term frequency to saturate. Without this the
                           # penalty has no ceiling and a short stub outscores a
                           # full job description.
  avg_jd_tokens: 1600      # reference "normal" JD length (a full ATS description;
                           # measured median ~1590 tokens -- NOT a job-board summary)
  body_cap: 60             # ceiling on the body keyword score
  tiers: { strong: 30, worth_a_look: 22 }

# ── filters: the gates ──────────────────────────────────────────────────────
filters:
  remote_only: true        # set false to include on-site / hybrid roles
  # "remote", or a place like "Louisville, KY" — used by the general sources
  # (adzuna, usajobs) to search that location. For a local search, set
  # remote_only: false AND location: "Your City, ST".
  location: remote
  radius_miles: 0          # 0 = the source's default; e.g. 200 = search 200 mi
                           # around `location` (Adzuna + USAJOBS only)
  max_age_days: 60         # drop anything older than this
  stale_after_days: 30     # penalize (don't drop) past this
  min_score: 22            # hide anything below this
  exclude_titles: [intern, recruiter, sales, marketing, support engineer]
  # WHERE a remote worker may sit, as opposed to whether the role is remote at all.
  # Unset = no boundary filter. "Remote - Brazil" and "Remote" are the same arrangement
  # with different boundaries, and this is what tells them apart.
  #   [US, ANY]             -> positively US-workable only
  #   [US, ANY, UNSTATED]   -> plus postings that never named a boundary
  # Listing US also accepts a US state (stored ISO 3166-2, e.g. US-CA) and the
  # US-inclusive regions AMERICAS and NORTH AMERICA -- you do not list those yourself.
  # A value the package never emits is warned about at load time rather than silently
  # matching nothing, so a typo like [USA] tells you instead of emptying your board.
  # UNSTATED is a separate opt-in on purpose: a bare "Remote" usually means "within the
  # country the employer can pay from", so unknown is NOT the same as anywhere.
  # remote_regions: [US, ANY, UNSTATED]
  #
  # exclude_locations REPLACES the default, it does not extend it -- so setting it here
  # was a DOWNGRADE: this key shipped with 6 names while the built-in default covers
  # every country the package knows plus the multi-country regions (66 tokens). Left
  # commented so `init` inherits the full list. Uncomment only to NARROW the filter,
  # e.g. if you can legally work in Canada:
  # exclude_locations: [india, europe, emea, apac, "(eu)"]

# ── sources: default = all official public APIs ─────────────────────────────
sources:
  ats:    [greenhouse, lever, ashby, smartrecruiters, workable, workday, rippling, teamtailor]
  # adzuna + usajobs are GENERAL (every field, any location) but need free keys —
  # set them and you can search any field / any city, not just remote tech.
  boards: [remotive, jobicy, arbeitnow, remoteok, himalayas, adzuna, usajobs, google_jobs, hn, braintrust, themuse]
  adzuna:                 # optional; set these env vars if you have free Adzuna keys
    app_id_env: ADZUNA_APP_ID
    app_key_env: ADZUNA_APP_KEY
  # Google for Jobs via SerpApi -- the meta-aggregator. It reaches company career
  # pages and enterprise ATSs (Workday, iCIMS) that Google indexed, and its apply
  # links go DIRECT to the employer rather than through an aggregator. Metered:
  # SerpApi's free tier is 250 searches/month and each PAGE is one search, so this
  # defaults to a single page (~10 roles per query). Skipped silently if unset.
  google_jobs:
    key_env: SERPAPI_KEY  # env var holding your SerpApi key
    pages: 1              # or set GOOGLE_JOBS_PAGES
    # THE QUOTA GUARD. Spend is pages x title_queries searches per run -- with the
    # six title queries above and one page that is 6/run, i.e. 180 of a 250/month
    # free tier at daily cadence. SerpApi reports exhaustion as a JSON error rather
    # than an HTTP failure, so without this the adapter degrades into a printed
    # notice and the shortlist just gets quieter. The remaining quota is checked
    # before each run against SerpApi's /account endpoint, which is free.
    max_searches_per_run: 12  # a hard ceiling for one run, whatever the plan says
    reserve: 25               # searches never spent, so an overrun cannot eat the
                              # end of the month. Set 0 to spend down to the floor.
  usajobs:
    results_per_page: 500  # the vendor max
    max_pages: 3           # USAJOBS pages with &Page=; 3 x 500 = 1,500 rows/query.
                           # It never paged at all before 0.7.0, so any keyword with
                           # more than 500 matches was silently truncated.
  # ── how deep each adapter walks its source ────────────────────────────────
  # Every value is a CEILING, not a target: there is no unbounded walk against
  # anyone's API anywhere in this package, and this is where the bounds live. Each
  # one also reads an env var of the same name in caps (WORKDAY_MAX_PAGES, ...),
  # which is what these settings default to.
  harvest_depth:
    smartrecruiters_max_pages: 10   # x100 rows; boards run to thousands
    workday_max_pages: 25           # x20 rows = 500 roles per employer
    himalayas_max_pages: 10         # the search lane
    himalayas_browse_pages: 50      # the browse lane, x20 = 1,000 rows
    themuse_max_pages: 5            # PER CATEGORY, across a 20-value taxonomy
    hn_threads: 2                   # 1 misses the prior month on the 1st
    # The two adapters that buy descriptions ONE REQUEST PER ROLE. Turning these off
    # is the biggest single lever on a harvest's request count -- and it costs the
    # body, which is the entire input to the fit score.
    workday_fetch_details: true
    workday_detail_workers: 8
    rippling_fetch_details: true

  funnel:
    auto_grow: true        # discover + add new companies from breadth hits
    max_new_per_run: 25    # cap on companies ADDED per run
    max_probes_per_run: 50 # cap on liveness probes ATTEMPTED per run.
                           # Separate on purpose: a dead slug is never an
                           # "add", so max_new_per_run alone let a run of
                           # dead candidates probe every one of them.

# ── ai: optional LLM semantic fit-ranking (off by default) ──────────────────
# Uncomment + set an api key env var to have an LLM re-rank the top of the list
# for *semantic* fit and add a one-line why/gaps note. Cost-bounded to top-N.
# llm:
#   enabled: true
#   provider: anthropic                 # anthropic | openai (OpenAI-compatible)
#   model: claude-haiku-4-5-20251001
#   api_key_env: ANTHROPIC_API_KEY      # the tool reads the key from this env var
#   rerank_top_n: 25
#   # base_url: https://api.openai.com/v1   # for an OpenAI-compatible endpoint
